[package]
name    = "users_crud"
version = "0.1.0"
edition = "2021"

[dependencies]
rusqlite   = { version = "0.31", features = ["bundled"] }
chrono     = "0.4"
fake       = { version = "2.9",  features = ["derive"] }
rand       = "0.8"
axum       = "0.7"
tokio      = { version = "1",    features = ["full"] }
serde      = { version = "1",    features = ["derive"] }
serde_json = "1"

